<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тестовая карточка товара</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <article class="card">
      <img class="card__image" src="coffee.svg" alt="Пачка кофе в зёрнах" width="320" height="200">
      <div class="card__body">
        <h2 class="card__title">Кофе в зёрнах «Утро»</h2>
        <p class="card__description">Арабика, средняя обжарка. Вкус с нотами шоколада и ореха.</p>
        <p class="card__price">890 ₽</p>
        <button class="card__button" type="button">В корзину</button>
      </div>
    </article>
  </main>
</body>
</html>
